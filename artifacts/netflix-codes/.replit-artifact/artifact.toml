kind = "web"
previewPath = "/"
title = "Netflix Access Codes"
version = "1.0.0"
id = "artifacts/netflix-codes"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25540

[services.development]
run = "pnpm --filter @workspace/netflix-codes run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/netflix-codes", "run", "build" ]
publicDir = "artifacts/netflix-codes/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25540"
BASE_PATH = "/"
